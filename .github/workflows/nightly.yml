name: Nightly Build

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build pinned Java21 + Purpur 1.21.1 artifacts
        run: ./gradlew build --no-daemon
      - name: Tag nightly artifacts
        run: |
          mkdir -p nightly
          cp purpur-plugin/build/libs/nation-realm.jar nightly/ 2>/dev/null || true
          echo "java=21 minecraft=1.21.1 purpur-api=$(grep purpur gradle/libs.versions.toml | head -1)" > nightly/BUILD_INFO.txt
      - uses: actions/upload-artifact@v7
        with:
          name: nightly
          path: nightly/
