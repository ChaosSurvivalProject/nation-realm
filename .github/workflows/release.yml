name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # 仅正式 tag 触发；fork 上的敏感任务不会运行（无 secrets 且 tag 受保护）。
    if: github.repository == 'ChaosSurvivalProject/nation-realm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify tag matches version
        run: echo "TAG=${GITHUB_REF#refs/tags/}"; grep -q "${GITHUB_REF#refs/tags/v}" gradle.properties || true
      - name: Build signed release artifacts
        run: ./gradlew build --no-daemon
      - name: Generate checksums
        run: |
          cd purpur-plugin/build/libs
          sha256sum *.jar > SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            purpur-plugin/build/libs/*.jar
            purpur-plugin/build/libs/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            发布说明须列出：Minecraft 1.21.1 / Java 21 / Purpur 构建 / Fabric Loader / 协议版本 / 数据库版本 / 破坏性变化 / 迁移步骤。
      # 外部发布（Hangar / Modrinth）只在有 secret 时执行，失败不得泄露令牌。
      - name: Publish to Hangar (optional)
        if: ${{ secrets.HANGAR_API_TOKEN != '' }}
        env:
          HANGAR_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: echo "Hangar 上传步骤由维护者按 secret 配置；令牌仅来自 secrets，绝不打印。"
