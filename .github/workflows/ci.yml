name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Format check + compile + test + build
        run: ./gradlew spotlessCheck check build --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests'
      - name: Upload server JAR (single fat JAR)
        uses: actions/upload-artifact@v7
        with:
          name: server-jar
          path: purpur-plugin/build/libs/nation-realm.jar

  conventional-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check PR title
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "$TITLE" | grep -E '^(feat|fix|test|docs|chore|refactor|ci|perf|build)(\(.+\))?: .+' \
            || (echo "PR 标题不符合 Conventional Commits"; exit 1)
