name: Database Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  migration-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_pw
          MYSQL_DATABASE: nation_realm_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply migrations and run integration tests
        env:
          NATION_DB_HOST: 127.0.0.1
          NATION_DB_USER: root
          NATION_DB_PASS: test_root_pw
          NATION_DB_NAME: nation_realm_test
        run: |
          mysql -h127.0.0.1 -uroot -ptest_root_pw nation_realm_test < database/mysql/migrations/V1__baseline.sql
          mysql -h127.0.0.1 -uroot -ptest_root_pw nation_realm_test < database/mysql/migrations/V2__radio.sql
          # 集成测试用 @Tag("integration") 标记，必须走独立 integrationTest task；
          # 普通 test task 排除该标签，直接用 --tests 过滤会报 No tests found。
          ./gradlew :nation-core:integrationTest --no-daemon
