name: 功能请求
description: 提出新功能或改进
title: "[Feat]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: 提议方案
    validations: { required: true }
  - type: textarea
    id: constraints
    attributes:
      label: 约束与风险（性能 / 安全 / 兼容）
