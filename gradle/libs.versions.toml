[versions]
java = "21"
gradle = "8.10.2"
junit = "6.1.3"
mockito = "5.24.0"
assertj = "3.27.7"
purpur = "1.21.1-R0.1-SNAPSHOT"
fabric-loader = "0.16.9"
minecraft = "1.21.1"
yarn = "1.21.1+build.3"
fabric-api = "0.114.0+1.21.1"
loom = "1.10-SNAPSHOT"
jackson = "2.23.0"
testcontainers = "1.21.4"
mysql-connector = "8.4.0"
spotless = "8.11.0"
shadow = "8.1.1"

[libraries]
junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
# JUnit 6 起 platform 与 jupiter 版本号统一；显式对齐 launcher 避免 Gradle 内置旧版导致发现失败。
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
purpur-api = { module = "org.purpurmc.purpur:purpur-api", version.ref = "purpur" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataclass = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-mysql = { module = "org.testcontainers:mysql", version.ref = "testcontainers" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-connector" }

[bundles]
test = ["junit-api", "junit-engine", "junit-params", "junit-platform-launcher", "mockito-core", "assertj-core"]

[plugins]
java-library = { id = "java-library" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
shadow = { id = "com.github.johnrengelman.shadow", version.ref = "shadow" }
